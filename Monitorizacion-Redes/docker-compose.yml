services:
  mysql-server:
    image: mariadb:10.11
    container_name: zabbix-db
    command:
      - mariadbd
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - zabbix-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-server:
    image: zabbix/zabbix-server-mysql:${ZBX_VERSION}
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      ZBX_HOSTNAME: ${ZBX_HOSTNAME}
    ports:
      - "10051:10051"
    volumes:
      - zbx_alertscripts:/usr/lib/zabbix/alertscripts:rw
      - zbx_externalscripts:/usr/lib/zabbix/externalscripts:rw
    depends_on:
      mysql-server:
        condition: service_healthy
    networks:
      - zabbix-net

  zabbix-web:
    image: zabbix/zabbix-web-apache-mysql:${ZBX_VERSION}
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: ${ZBX_TIMEZONE}
    ports:
      - "${WEB_PORT}:8080"
    depends_on:
      mysql-server:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - zabbix-net

  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZBX_VERSION}
    container_name: zabbix-agent
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: ${ZBX_HOSTNAME}
      ZBX_SERVER_HOST: zabbix-server
    ports:
      - "10050:10050"
    depends_on:
      - zabbix-server
    networks:
      - zabbix-net

  # Servicio "one-shot": corrige automáticamente la interfaz del agente del
  # host "Zabbix server" precargado por la imagen oficial (viene apuntando a
  # 127.0.0.1, asumiendo servidor y agente en la misma máquina). Aquí cada
  # componente vive en su propio contenedor, así que la redirige a
  # "zabbix-agent" por DNS. Es idempotente: en arranques posteriores detecta
  # que ya está bien configurada y no hace nada. Ver scripts/fix-agent-interface.sh.
  zabbix-init:
    image: mariadb:10.11
    container_name: zabbix-init
    restart: "no"
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./scripts/fix-agent-interface.sh:/fix-agent-interface.sh:ro
    entrypoint: ["/bin/sh", "/fix-agent-interface.sh"]
    networks:
      - zabbix-net

networks:
  zabbix-net:
    driver: bridge

volumes:
  db_data:
  zbx_alertscripts:
  zbx_externalscripts:
